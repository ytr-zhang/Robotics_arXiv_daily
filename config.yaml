# TODO: add papers by configuration file
base_url: "https://arxiv.paperswithcode.com/api/v0/papers/"
user_name: "ytr-zhang"
repo_name: "robotics-arxiv-daily"
show_authors: True
show_links: True
show_badge: False
max_results: 20

publish_readme: True
publish_gitpage: True
publish_wechat: True

# file paths
json_readme_path: './docs/cv-arxiv-daily.json'
json_gitpage_path: './docs/cv-arxiv-daily-web.json'
json_wechat_path: './docs/cv-arxiv-daily-wechat.json'

md_readme_path: 'README.md'
md_gitpage_path: './docs/index.md'
md_wechat_path: './docs/wechat.md'

# keywords to search
keywords:
    # Candidate feeds; keywords cannot establish importance or official authorship.
    "LLM-for-Embodied-AI":
        query: >-
            (all:"large language model" OR all:"large language models" OR all:LLM OR all:LLMs)
            AND (cat:cs.RO OR ti:robot OR ti:robotic OR ti:robotics OR ti:humanoid
            OR all:"embodied AI" OR all:"embodied intelligence"
            OR all:"embodied agent" OR all:"embodied agents"
            OR all:"robot manipulation" OR all:"robotic manipulation"
            OR all:"robot navigation" OR all:"task and motion planning")
    "LLM-Technical-Reports":
        query: >-
            (ti:"technical report" OR ti:"model report" OR ti:"system card")
            AND (ti:"language model" OR ti:"language models" OR ti:LLM OR ti:LLMs
            OR ti:GPT OR ti:Gemini OR ti:Claude OR ti:Llama OR ti:Qwen
            OR ti:DeepSeek OR ti:Kimi OR ti:GLM OR ti:Mistral OR ti:Gemma
            OR ti:Hunyuan OR ti:MiniMax OR ti:MiMo OR ti:ERNIE OR ti:OLMo
            OR ti:Nemotron OR ti:Seed OR ti:Doubao OR ti:Step)
    # --------- My Keywords ---------
    "Manipulation":
        filters: ["Robot Manipulation", "Robotic Manipulation", "Robot Learning", "Imitation Learning"]
    "VLM":
        filters: ["Vision Language Model", "Vision Language Models", "Vision-Language Model", "Vision-Language Models"]
    "VLA":
        filters: ["Vision Language Action","Vision-Language-Action"]
    "Humanoid":
        filters: ["Humanoid Robot", "Humanoid"]
    "Humanoid-Locomotion":
        filters: ["Humanoid Locomotion", "Bipedal Locomotion", "Legged Locomotion"]
    "VLN-Navigation":
        filters: ["Vision-Language Navigation", "VLN", "Embodied Navigation"]
    "VLA-Navigation":
        filters: ["Vision-Language-Action Navigation", "VLA Navigation"]
    "Dexterous":
        filters: ["Dexterous Manipulation", "Dexterous hand", "Dexterity", "Dexterous"]
    "Semantic-SLAM":
        filters: ["Semantic SLAM", "VLM SLAM", "Language-driven SLAM", "Open-vocabulary SLAM"]
